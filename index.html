<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMF - Fluxo de Caixa</title>
    <!-- Tailwind CSS CDN para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            500: '#D4AF37',
                            600: '#C59B27',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="bg-slate-900 border-b border-slate-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-gold-500 text-slate-950 font-bold px-3 py-1.5 rounded shadow text-lg">AMF</div>
                <h1 class="text-xl font-semibold tracking-wider text-slate-200">Fluxo de Caixa</h1>
            </div>
            <div class="text-xs text-slate-400">
                <span>Versão 1.0</span>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
        
        <!-- Cards de Resumo -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow">
                <h3 class="text-slate-400 text-sm font-medium mb-1">Saldo Total em Caixa</h3>
                <p id="saldo-total" class="text-3xl font-bold text-gold-500">R$ 0,00</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow">
                <h3 class="text-slate-400 text-sm font-medium mb-1">Total de Entradas (Mês)</h3>
                <p id="total-entradas" class="text-3xl font-bold text-emerald-500">R$ 0,00</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow">
                <h3 class="text-slate-400 text-sm font-medium mb-1">Total de Saídas (Mês)</h3>
                <p id="total-saidas" class="text-3xl font-bold text-rose-500">R$ 0,00</p>
            </div>
        </div>

        <!-- Formulário e Tabela -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Formulário de Lançamento -->
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow h-fit">
                <h2 class="text-lg font-semibold mb-4 text-slate-200 border-b border-slate-800 pb-2">Novo Lançamento</h2>
                <form id="form-transacao" class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Tipo</label>
                        <select id="tipo" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-gold-500">
                            <option value="entrada">Entrada (Receita)</option>
                            <option value="saida">Saída (Despesa)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Descrição</label>
                        <input type="text" id="descricao" required placeholder="Ex: Pagamento de cliente, Aluguel..." class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-gold-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Valor (R$)</label>
                        <input type="number" step="0.01" id="valor" required placeholder="0,00" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-gold-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Data</label>
                        <input type="date" id="data" required class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-gold-500">
                    </div>
                    <button type="submit" class="w-full bg-gold-500 hover:bg-gold-600 text-slate-950 font-bold py-2.5 rounded transition duration-200 shadow">
                        Adicionar Lançamento
                    </button>
                </form>
            </div>

            <!-- Tabela de Lançamentos Recentes -->
            <div class="lg:col-span-2 bg-slate-900 border border-slate-800 p-6 rounded-xl shadow">
                <h2 class="text-lg font-semibold mb-4 text-slate-200 border-b border-slate-800 pb-2">Histórico de Transações</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-800 text-xs uppercase text-slate-400">
                                <th class="py-3 px-4">Data</th>
                                <th class="py-3 px-4">Descrição</th>
                                <th class="py-3 px-4">Tipo</th>
                                <th class="py-3 px-4 text-right">Valor</th>
                                <th class="py-3 px-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-transacoes" class="divide-y divide-slate-800/60 text-sm">
                            <!-- Os dados serão injetados via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-slate-900 border-t border-slate-800 mt-12 py-4 text-center text-xs text-slate-500">
        AMF Sistema de Gestão Financeira &copy; 2026 - Todos os direitos reservados.
    </footer>

    <!-- Lógica em JavaScript -->
    <script>
        // Inicializa a data atual no formulário
        document.getElementById('data').valueAsDate = new Date();

        // Recupera transações salvas ou inicia array vazio
        let transacoes = JSON.parse(localStorage.getItem('amf_fluxo_caixa')) || [];

        const form = document.getElementById('form-transacao');
        const tabela = document.getElementById('tabela-transacoes');
        const elSaldo = document.getElementById('saldo-total');
        const elEntradas = document.getElementById('total-entradas');
        const elSaidas = document.getElementById('total-saidas');

        // Formata número para padrão monetário brasileiro (BRL)
        function formatarMoeda(valor) {
            return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // Atualiza a interface (tabela e totais)
        function atualizarInterface() {
            tabela.innerHTML = '';
            let totalEntradas = 0;
            let totalSaidas = 0;

            if (transacoes.length === 0) {
                tabela.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-500">Nenhum lançamento cadastrado.</td></tr>`;
            }

            transacoes.forEach((t, index) => {
                const valorNum = parseFloat(t.valor);
                if (t.tipo === 'entrada') {
                    totalEntradas += valorNum;
                } else {
                    totalSaidas += valorNum;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-3 px-4 text-slate-300">${t.data.split('-').reverse().join('/')}</td>
                    <td class="py-3 px-4 font-medium text-slate-200">${t.descricao}</td>
                    <td class="py-3 px-4">
                        <span class="px-2 py-1 rounded text-xs font-semibold ${t.tipo === 'entrada' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'}">
                            ${t.tipo.toUpperCase()}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-right font-semibold ${t.tipo === 'entrada' ? 'text-emerald-400' : 'text-rose-400'}">
                        ${t.tipo === 'entrada' ? '+' : '-'} ${formatarMoeda(t.valor)}
                    </td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="removerTransacao(${index})" class="text-slate-500 hover:text-rose-400 transition" title="Excluir">
                            &times; Excluir
                        </button>
                    </td>
                `;
                tabela.appendChild(tr);
            });

            const saldoGeral = totalEntradas - totalSaidas;
            elSaldo.textContent = formatarMoeda(saldoGeral);
            elSaldo.className = `text-3xl font-bold ${saldoGeral >= 0 ? 'text-gold-500' : 'text-rose-500'}`;
            elEntradas.textContent = formatarMoeda(totalEntradas);
            elSaidas.textContent = formatarMoeda(totalSaidas);

            // Salva no armazenamento local do navegador
            localStorage.setItem('amf_fluxo_caixa', JSON.stringify(transacoes));
        }

        // Adiciona nova transação
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const novaTransacao = {
                tipo: document.getElementById('tipo').value,
                descricao: document.getElementById('descricao').value,
                valor: document.getElementById('valor').value,
                data: document.getElementById('data').value
            };

            transacoes.push(novaTransacao);
            atualizarInterface();
            form.reset();
            document.getElementById('data').valueAsDate = new Date();
        });

        // Remove transação
        window.removerTransacao = function(index) {
            if (confirm('Deseja realmente excluir este lançamento?')) {
                transacoes.splice(index, 1);
                atualizarInterface();
            }
        };

        // Executa ao carregar a página
        atualizarInterface();
    </script>
</body>
</html>
