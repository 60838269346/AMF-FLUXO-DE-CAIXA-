<!-- Filtros de Fluxo de Caixa (Mês, Ano e Semana) -->
<div class="flex flex-wrap items-center gap-3 mb-4 bg-white p-4 rounded-lg shadow-sm border border-gray-200">
  <!-- Filtro de Ano -->
  <div class="flex items-center gap-2">
    <label for="filtroAno" class="text-sm font-medium text-gray-700">Ano:</label>
    <select id="filtroAno" onchange="filtrarFluxoCaixa()" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option value="">Todos os Anos</option>
      <option value="2026">2026</option>
      <option value="2025">2025</option>
    </select>
  </div>

  <!-- Filtro de Mês -->
  <div class="flex items-center gap-2">
    <label for="filtroMes" class="text-sm font-medium text-gray-700">Mês:</label>
    <select id="filtroMes" onchange="filtrarFluxoCaixa()" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option value="">Todos os Meses</option>
      <option value="01">Janeiro</option>
      <option value="02">Fevereiro</option>
      <option value="03">Março</option>
      <option value="04">Abril</option>
      <option value="05">Maio</option>
      <option value="06">Junho</option>
      <option value="07">Julho</option>
      <option value="08">Agosto</option>
      <option value="09">Setembro</option>
      <option value="10">Outubro</option>
      <option value="11">Novembro</option>
      <option value="12">Dezembro</option>
    </select>
  </div>

  <!-- Filtro de Semana (1 a 5) -->
  <div class="flex items-center gap-2">
    <label for="filtroSemana" class="text-sm font-medium text-gray-700">Semana:</label>
    <select id="filtroSemana" onchange="filtrarFluxoCaixa()" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option value="">Todas as Semanas</option>
      <option value="1">Semana 1 (Dias 1 a 7)</option>
      <option value="2">Semana 2 (Dias 8 a 14)</option>
      <option value="3">Semana 3 (Dias 15 a 21)</option>
      <option value="4">Semana 4 (Dias 22 a 28)</option>
      <option value="5">Semana 5 (Dias 29 a 31)</option>
    </select>
  </div>

  <button onclick="limparFiltroFluxo()" class="text-sm text-gray-500 hover:text-gray-700 underline ml-auto">
    Limpar Filtros
  </button>
</div>
